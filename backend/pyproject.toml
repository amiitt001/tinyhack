[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsphere-v3-api"
version = "0.1.0"
description = "SkillSphere V3 backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.133.0",
  "google-adk==2.13.0",
  "google-genai==2.34.0",
  "httpx==0.28.1",
  "orjson==3.11.3",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "PyJWT[crypto]==2.10.1",
  "python-multipart==0.0.20",
  "pypdf==6.1.1",
  "ruff==0.13.2",
  "sqlalchemy==2.0.43",
  "supabase==2.18.1",
  "tenacity==9.1.2",
  "tinyfish==0.11.0",
  "python-docx==1.2.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-cov==6.2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
